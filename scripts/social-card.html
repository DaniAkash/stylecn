<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(ellipse 900px 600px at 25% 30%, rgba(255, 200, 175, 0.45), transparent 60%),
          radial-gradient(ellipse 700px 500px at 80% 80%, rgba(180, 120, 255, 0.30), transparent 65%),
          radial-gradient(ellipse 500px 400px at 70% 20%, rgba(80, 220, 160, 0.22), transparent 65%),
          #fafafa;
        color: #0a0a0a;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .icon {
        width: 132px;
        height: 132px;
      }
      .brand {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .tagline {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.1;
        max-width: 920px;
      }
      .tagline em {
        font-style: normal;
        background: linear-gradient(90deg, #ff385c, #b54cff 40%, #4361ff 75%, #0aa66e);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brands {
        font-size: 22px;
        font-weight: 500;
        color: #555;
        letter-spacing: 0.02em;
        max-width: 820px;
        line-height: 1.5;
      }
      .url {
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 22px;
        font-weight: 600;
        color: #0a0a0a;
        background: #ffffffcc;
        padding: 14px 22px;
        border-radius: 999px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <img src="../public/icon.png" alt="" class="icon" />
      <div class="brand">stylecn</div>
    </div>
    <div class="tagline">
      Brand-themed presets for <em>shadcn/ui</em>.
    </div>
    <div class="bottom">
      <div class="brands">
        Apple · Stripe · Linear · Airbnb · Cursor · Resend · Raycast · Claude · Duolingo · ElevenLabs · Fly.io · Superhuman · Todoist · Wise
      </div>
      <div class="url">daniakash.github.io/stylecn</div>
    </div>
  </body>
</html>
